version: "3.9"

services:
  db:
    image: postgres:16
    container_name: vita_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vita
      POSTGRES_PASSWORD: vita
      POSTGRES_DB: vita
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
