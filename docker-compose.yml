services:
  db:
    image: postgres:16
    container_name: vita_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vita
      POSTGRES_PASSWORD: vita
      POSTGRES_DB: vita
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./api
    container_name: vita_api
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+psycopg://vita:vita@db:5432/vita
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
